<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0B" />
      <stop offset="100%" stop-color="#141417" />
    </linearGradient>

    <!-- Main Purple/Indigo Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Cyan/Blue Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base rounded icon container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGradient)" stroke="#1F1F24" stroke-width="8" />

  <!-- Database Stack -->
  <g transform="translate(0, -10)" filter="url(#glow)">
    <!-- Layer 3 (Bottom) -->
    <path d="M156 320 A 100 40 0 0 0 356 320 L 356 360 A 100 40 0 0 1 156 360 Z" fill="url(#primaryGrad)" opacity="0.4" />
    <ellipse cx="256" cy="320" rx="100" ry="40" fill="#141417" stroke="url(#primaryGrad)" stroke-width="6" opacity="0.6" />

    <!-- Layer 2 (Middle) -->
    <path d="M156 240 A 100 40 0 0 0 356 240 L 356 280 A 100 40 0 0 1 156 280 Z" fill="url(#primaryGrad)" opacity="0.7" />
    <ellipse cx="256" cy="240" rx="100" ry="40" fill="#141417" stroke="url(#primaryGrad)" stroke-width="6" opacity="0.8" />

    <!-- Layer 1 (Top) -->
    <path d="M156 160 A 100 40 0 0 0 356 160 L 356 200 A 100 40 0 0 1 156 200 Z" fill="url(#primaryGrad)" />
    <ellipse cx="256" cy="160" rx="100" ry="40" fill="#1F1F24" stroke="url(#primaryGrad)" stroke-width="8" />
    
    <!-- Cylinder details (lines running down the side) -->
    <line x1="156" y1="160" x2="156" y2="360" stroke="url(#primaryGrad)" stroke-width="4" opacity="0.3" />
    <line x1="356" y1="160" x2="356" y2="360" stroke="url(#primaryGrad)" stroke-width="4" opacity="0.3" />
  </g>

  <!-- Glowing CLI Console on top -->
  <g transform="translate(190, 210)" filter="url(#glow)">
    <!-- Card Base -->
    <rect width="220" height="160" rx="20" fill="#0A0A0B" stroke="url(#accentGrad)" stroke-width="6" />
    
    <!-- Top Dots -->
    <circle cx="30" cy="25" r="6" fill="#EF4444" />
    <circle cx="50" cy="25" r="6" fill="#F59E0B" />
    <circle cx="70" cy="25" r="6" fill="#10B981" />

    <!-- CLI prompt >_ -->
    <path d="M40 70 L70 90 L40 110" fill="none" stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="85" y1="110" x2="135" y2="110" stroke="#F8FAFC" stroke-width="8" stroke-linecap="round" />
  </g>
</svg>
